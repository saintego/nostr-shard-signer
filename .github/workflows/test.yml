name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Smoke and type tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Builds the signer, type-checks the npm package, runs Playwright.
      - name: Test
        run: npm test

      # Prompts in a popup (shared sign-in, or VITE_POPUP_CONFIRM=always): a
      # second build, with the clickjacking tests that need it (#62).
      - name: Test prompts in a popup
        run: VITE_POPUP_CONFIRM=always npm run build && VITE_POPUP_CONFIRM=always npx playwright test tests/clickjacking.spec.js

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
