name: Publish npm package

# Publishes the npm/ workspace (nostr-shard-signer) when a GitHub release with
# a tag like npm-v0.1.1 is published. The tag must match npm/package.json.
#
# Uses npm trusted publishing (OIDC): no npm token is stored in GitHub. npm
# links each version to this workflow run (provenance).
#
# One-time setup on npmjs.com → nostr-shard-signer → Settings → Trusted publishing:
#   Publisher: GitHub Actions, Organization or user: saintego,
#   Repository: nostr-shard-signer, Workflow filename: npm-publish.yml,
#   Environment: npm
#
# Release steps: README.md → "Publishing the npm package".

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # OIDC token for npm trusted publishing

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish nostr-shard-signer
    if: startsWith(github.event.release.tag_name, 'npm-v')
    runs-on: ubuntu-latest
    # Add required reviewers to this environment (Settings → Environments) to
    # approve each publish by hand.
    environment: npm

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs npm 11.5.1+, which ships with Node 24.
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Check the tag matches npm/package.json
        run: |
          version=$(node -p "require('./npm/package.json').version")
          tag=${{ github.event.release.tag_name }}
          if [ "$tag" != "npm-v$version" ]; then
            echo "::error::Tag $tag doesn't match npm/package.json version $version (expected npm-v$version)"
            exit 1
          fi
          if npm view "nostr-shard-signer@$version" version >/dev/null 2>&1; then
            echo "::error::nostr-shard-signer@$version is already published; bump the version"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test
        run: npm test

      # A version with a prerelease suffix (0.2.0-beta.1) goes to the "next"
      # tag, so `npm install nostr-shard-signer` keeps getting the last stable.
      - name: Publish
        run: |
          version=$(node -p "require('./npm/package.json').version")
          case "$version" in
            *-*) npm publish --workspace=npm --tag next ;;
            *) npm publish --workspace=npm ;;
          esac
