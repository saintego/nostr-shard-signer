<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!--
    NOTE: 'unsafe-inline' is needed for Web3Auth's internal styles/scripts.
    Remove it only after verifying no eval() or inline scripts are used.
    For local Vite dev, HMR also requires 'unsafe-inline' and ws://*.
  -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none';
                 script-src 'self' 'unsafe-inline' https://*.web3auth.io;
                 style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
                 img-src 'self' https: data:;
                 connect-src 'self' https: wss: ws: https://*.web3auth.io wss://*.web3auth.io;
                 frame-src https://*.web3auth.io;
                 worker-src blob:;
                 font-src 'self' https:;" />
  <title>Nostr Signer</title>
</head>
<body>
  <div id="root"></div>
  <!--
    Polyfill process.nextTick before any ES module loads.
    Web3Auth v10 bundles readable-stream which calls process.nextTick inside
    pre-compiled chunks that run before Vite's module-level polyfill injection.
    Setting it on the global object here guarantees it is always present.
  -->
  <script>
    (function () {
      var p = globalThis.process || (globalThis.process = {});
      if (typeof p.nextTick !== 'function') {
        p.nextTick = function nextTick(fn) {
          var a = Array.prototype.slice.call(arguments, 1);
          Promise.resolve().then(function () { fn.apply(null, a); });
        };
      }
      p.env = p.env || {};
      p.version = p.version || 'v18.0.0';
      p.versions = p.versions || {};
      p.platform = p.platform || 'browser';
    }());
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
