<!doctype html>
<!--
  Minimal nostr-shard-signer integration: sign in, show the pubkey, publish a note.

  To run it on your own site:
    1. Get a Web3Auth client ID (https://web3auth.io) and add https://saintego.github.io
       to its Allowlist URLs (Project Settings → Domains).
    2. Register the client ID with your site's origin in the portal:
       https://saintego.github.io/nostr-shard-signer/portal/
       (localhost cannot be registered.)
    3. Replace YOUR_WEB3AUTH_CLIENT_ID below and serve this file from that origin.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>nostr-shard-signer example</title>
    <!-- Classic script, not a module: it defines window.NostrBridge. -->
    <script src="https://saintego.github.io/nostr-shard-signer/nostr-bridge.js"></script>
  </head>
  <body>
    <p id="status">Loading…</p>
    <!-- Optional: your own buttons. The floating widget's "Sign in" works too. -->
    <button id="login" hidden>Sign in</button>
    <button id="logout" hidden>Sign out</button>
    <textarea id="note" rows="3" cols="40">Hello Nostr!</textarea>
    <button id="publish" disabled>Publish note</button>

    <script type="module">
      import { SimplePool } from "https://cdn.jsdelivr.net/npm/nostr-tools@2/lib/esm/index.js";

      const RELAYS = ["wss://relay.damus.io", "wss://nos.lol"];
      const statusEl = document.getElementById("status");
      const publishBtn = document.getElementById("publish");
      const loginBtn = document.getElementById("login");
      const logoutBtn = document.getElementById("logout");

      // Called with the current state once it is known (including a session
      // restored on load), then on every sign-in / sign-out.
      NostrBridge.onAuthChange(({ loggedIn, pubkey }) => {
        statusEl.textContent = loggedIn ? "Signed in as " + pubkey : "Not signed in.";
        publishBtn.disabled = !loggedIn;
        loginBtn.hidden = loggedIn;
        logoutBtn.hidden = !loggedIn;
      });

      // Setup problems (e.g. this origin is not registered for the clientId).
      // origin === "" marks events dispatched by the bridge itself.
      window.addEventListener("message", (e) => {
        if (e.origin === "" && e.data?.type === "SIGNER_ERROR")
          statusEl.textContent = e.data.message + " " + e.data.hint;
      });

      loginBtn.addEventListener("click", () => NostrBridge.login());
      logoutBtn.addEventListener("click", () => NostrBridge.logout());

      // Safe to call more than once; later calls return the same promise.
      await NostrBridge.init({ clientId: "YOUR_WEB3AUTH_CLIENT_ID" });

      publishBtn.addEventListener("click", async () => {
        const signed = await window.nostr.signEvent({
          kind: 1,
          created_at: Math.floor(Date.now() / 1000),
          tags: [],
          content: document.getElementById("note").value,
        });
        // The bridge only signs; publishing to relays is up to the app.
        const pool = new SimplePool();
        await Promise.any(pool.publish(RELAYS, signed));
        pool.close(RELAYS);
        statusEl.textContent = "Published " + signed.id;
      });
    </script>
  </body>
</html>
